<!DOCTYPE html>
<html lang="zh">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>方案B · 墨窑 · 全屏轮播</title>
<style>
  :root{
    --bg:#1b1713; --card:#241f19; --ink:#f0e9dd; --muted:#9c9181;
    --amber:#c8a063; --line:#3a332b;
  }
  *{margin:0;padding:0;box-sizing:border-box;-webkit-tap-highlight-color:transparent}
  body{font-family:-apple-system,"PingFang SC","Noto Sans SC",sans-serif;background:#0e0c0a;color:var(--ink);width:390px;height:844px;margin:0 auto;overflow:hidden;position:relative;box-shadow:0 0 60px rgba(0,0,0,.6)}
  /* 全屏轮播首页 */
  .carousel{position:absolute;inset:0}
  .slide{position:absolute;inset:0;opacity:0;transition:opacity .5s}
  .slide.on{opacity:1}
  .slide .img{position:absolute;inset:0}
  .slide .img img{width:100%;height:100%;object-fit:cover;display:block}
  .slide .shade{position:absolute;inset:0;background:linear-gradient(180deg,rgba(20,16,12,.35) 0%,rgba(20,16,12,0) 35%,rgba(20,16,12,.88) 100%)}
  .slide .cap{position:absolute;left:22px;right:22px;bottom:120px}
  .slide .cap .tag{font-size:11px;color:var(--amber);letter-spacing:.3em;margin-bottom:8px}
  .slide .cap h2{font-family:Georgia,"Songti SC",serif;font-size:26px;letter-spacing:.03em;margin-bottom:6px;text-shadow:0 2px 12px rgba(0,0,0,.5)}
  .slide .cap .price{font-size:16px;color:var(--amber)}
  .slide .fav{position:absolute;right:20px;bottom:120px;width:44px;height:44px;border-radius:22px;background:rgba(255,255,255,.12);backdrop-filter:blur(6px);border:1px solid rgba(255,255,255,.2);color:#fff;font-size:19px;cursor:pointer}
  /* 顶栏悬浮 */
  .top{position:absolute;top:0;left:0;right:0;display:flex;align-items:center;justify-content:space-between;padding:14px 18px;z-index:5}
  .brand{font-family:Georgia,"Songti SC",serif;font-size:20px;letter-spacing:.12em;text-shadow:0 1px 8px rgba(0,0,0,.6)}
  .top-ic{display:flex;gap:14px}
  .top-ic button{background:none;border:none;color:#f5eee1;font-size:17px;cursor:pointer;position:relative;text-shadow:0 1px 6px rgba(0,0,0,.6)}
  .badge{position:absolute;top:-6px;right:-8px;background:var(--amber);color:#1b1713;font-size:10px;border-radius:8px;padding:1px 5px;font-weight:700}
  /* 圆点指示 */
  .dots{position:absolute;bottom:150px;left:22px;display:flex;gap:7px;z-index:5}
  .dot{width:6px;height:6px;border-radius:3px;background:rgba(255,255,255,.4);transition:.3s}
  .dot.on{width:20px;background:var(--amber)}
  /* 底部 dock */
  .dock{position:absolute;left:14px;right:14px;bottom:14px;display:flex;background:rgba(36,31,25,.9);backdrop-filter:blur(10px);border:1px solid var(--line);border-radius:18px;padding:10px 6px;z-index:6}
  .dock button{flex:1;background:none;border:none;color:var(--muted);font-size:10px;cursor:pointer;display:flex;flex-direction:column;align-items:center;gap:4px}
  .dock button.on{color:var(--amber)}
  .dock .ic{font-size:19px;line-height:1}
  .dock .cta{flex:1.3;background:var(--amber);color:#1b1713;border-radius:12px;border:none;font-size:13px;font-weight:700;letter-spacing:.05em;cursor:pointer;margin:0 4px}
  /* 商品网格页 */
  .screen{display:none;position:absolute;inset:0;flex-direction:column;background:var(--bg)}
  .screen.on{display:flex}
  .grid3{display:grid;grid-template-columns:1fr 1fr;gap:10px;padding:14px;flex:1;overflow-y:auto}
  .gcard{background:var(--card);border:1px solid var(--line);border-radius:10px;overflow:hidden;cursor:pointer}
  .gcard .ph{height:170px;background:#2c261f;overflow:hidden}
  .gcard .ph img{width:100%;height:100%;object-fit:cover;display:block}
  .gcard .info{padding:9px 12px 11px}
  .gcard h3{font-size:12px;font-weight:600}
  .gcard .price{font-size:12px;color:var(--amber);margin-top:3px}
  .ghead{display:flex;align-items:center;justify-content:space-between;padding:14px 18px}
  .ghead h2{font-family:Georgia,"Songti SC",serif;font-size:18px;letter-spacing:.05em}
  .ghead button{background:none;border:none;color:var(--muted);font-size:18px;cursor:pointer}
  /* 详情 sheet */
  .sheet{position:absolute;left:0;right:0;bottom:0;background:var(--card);border-radius:20px 20px 0 0;transform:translateY(110%);transition:.3s;z-index:30;padding:18px 18px 22px;border-top:1px solid var(--line)}
  .sheet.on{transform:translateY(0)}
  .grab{width:40px;height:4px;background:var(--line);border-radius:2px;margin:0 auto 14px}
  .sheet .row{display:flex;gap:14px;align-items:flex-start}
  .sheet .th{width:110px;height:130px;border-radius:10px;object-fit:cover;flex-shrink:0}
  .sheet h3{font-family:Georgia,"Songti SC",serif;font-size:20px;margin-bottom:4px}
  .sheet .price{color:var(--amber);font-size:17px;margin-bottom:8px}
  .sheet p{font-size:12.5px;color:var(--muted);line-height:1.7}
  .sheet .btns{display:flex;gap:10px;margin-top:16px}
  .sheet .btns button{flex:1;height:46px;border-radius:12px;border:none;font-size:14px;cursor:pointer}
  .b-cart{background:var(--line);color:var(--ink)}
  .b-buy{background:var(--amber);color:#1b1713;font-weight:700;letter-spacing:.06em}
  .mask{position:absolute;inset:0;background:rgba(0,0,0,.55);opacity:0;pointer-events:none;transition:.25s;z-index:20}
  .mask.on{opacity:1;pointer-events:auto}
  /* 下单确认 */
  .pay-sheet{position:absolute;left:0;right:0;bottom:0;background:var(--card);border-radius:20px 20px 0 0;transform:translateY(110%);transition:.3s;z-index:40;padding:20px 18px 24px;border-top:1px solid var(--line)}
  .pay-sheet.on{transform:translateY(0)}
  .pay-sheet .line{display:flex;justify-content:space-between;font-size:13px;color:var(--muted);padding:7px 0}
  .pay-sheet .line b{color:var(--ink);font-weight:600}
  .pay-sheet .total{display:flex;justify-content:space-between;font-size:17px;padding:12px 0;border-top:1px solid var(--line);margin-top:6px}
  .pay-sheet .total b{color:var(--amber)}
  .pay-cta{width:100%;height:50px;border-radius:12px;border:none;background:var(--amber);color:#1b1713;font-size:15px;font-weight:700;letter-spacing:.08em;cursor:pointer;margin-top:14px}
</style>
</head>
<body>

<!-- 首页：全屏轮播 -->
<div class="carousel" id="scr-carousel">
  <div class="slide on">
    <div class="img"><img src="https://qingyunchai.netlify.app/assets/photos/product/lamp-blue-gray/lamp-blue-gray-1.jpg" onerror="this.src='data:image/svg+xml,%3Csvg xmlns=%22http://www.w3.org/2000/svg%22 width=%22390%22 height=%22844%22%3E%3Crect fill=%22%23241f19%22 width=%22390%22 height=%22844%22/%3E%3C/svg%3E'"></div>
    <div class="shade"></div>
    <div class="cap">
      <div class="tag">木火落灰 · 世间唯一</div>
      <h2>守光 · 罐形 · 深青灰</h2>
      <div class="price">€260</div>
    </div>
    <button class="fav" onclick="toast('已收藏 ❤')">♡</button>
  </div>
  <div class="slide">
    <div class="img"><img src="https://qingyunchai.netlify.app/assets/photos/product/mug-lava/mug-lava-1.jpg" onerror="this.src='data:image/svg+xml,%3Csvg xmlns=%22http://www.w3.org/2000/svg%22 width=%22390%22 height=%22844%22%3E%3Crect fill=%22%23241f19%22 width=%22390%22 height=%22844%22/%3E%3C/svg%3E'"></div>
    <div class="shade"></div>
    <div class="cap">
      <div class="tag">木火落灰 · 世间唯一</div>
      <h2>马克杯 · 熔岩</h2>
      <div class="price">€38</div>
    </div>
    <button class="fav" onclick="toast('已收藏 ❤')">♡</button>
  </div>
  <div class="slide">
    <div class="img"><img src="https://qingyunchai.netlify.app/assets/photos/product/fairness-cup-cream/fairness-cup-cream-1.jpg" onerror="this.src='data:image/svg+xml,%3Csvg xmlns=%22http://www.w3.org/2000/svg%22 width=%22390%22 height=%22844%22%3E%3Crect fill=%22%23241f19%22 width=%22390%22 height=%22844%22/%3E%3C/svg%3E'"></div>
    <div class="shade"></div>
    <div class="cap">
      <div class="tag">木火落灰 · 世间唯一</div>
      <h2>盖碗 · 乳白</h2>
      <div class="price">€66</div>
    </div>
    <button class="fav" onclick="toast('已收藏 ❤')">♡</button>
  </div>
  <div class="top">
    <div class="brand">清 原</div>
    <div class="top-ic">
      <button onclick="toast('🔍 搜索')">🔍</button>
      <button onclick="toast('购物袋 · 2 件')">🛍️<span class="badge">2</span></button>
    </div>
  </div>
  <div class="dots"><div class="dot on"></div><div class="dot"></div><div class="dot"></div></div>
  <div class="dock">
    <button class="on"><span class="ic">◉</span>窑口</button>
    <button onclick="showGrid()"><span class="ic">▦</span>作品</button>
    <button class="cta" onclick="openDetail('守光 · 罐形 · 深青灰','€260')">立即购买</button>
    <button onclick="toast('🔥 工艺')"><span class="ic">🔥</span>工艺</button>
    <button onclick="toast('👤 我的')"><span class="ic">👤</span>我的</button>
  </div>
</div>

<!-- 商品网格 -->
<div class="screen" id="scr-grid">
  <div class="ghead"><h2>全部作品</h2><button onclick="backCarousel()">✕</button></div>
  <div class="grid3">
    <div class="gcard" onclick="openDetail('守光 · 罐形 · 深青灰','€260')"><div class="ph"><img src="https://qingyunchai.netlify.app/assets/photos/product/lamp-blue-gray/lamp-blue-gray-1.jpg" onerror="this.style.display='none'"></div><div class="info"><h3>守光 · 罐形 · 深青灰</h3><div class="price">€260</div></div></div>
    <div class="gcard" onclick="openDetail('守光 · 球体 · 陨石坑','€260')"><div class="ph"><img src="https://qingyunchai.netlify.app/assets/photos/product/lamp-bicolor-sphere/lamp-bicolor-sphere-1.jpg" onerror="this.style.display='none'"></div><div class="info"><h3>守光 · 球体 · 陨石坑</h3><div class="price">€260</div></div></div>
    <div class="gcard" onclick="openDetail('马克杯 · 熔岩','€38')"><div class="ph"><img src="https://qingyunchai.netlify.app/assets/photos/product/mug-lava/mug-lava-1.jpg" onerror="this.style.display='none'"></div><div class="info"><h3>马克杯 · 熔岩</h3><div class="price">€38</div></div></div>
    <div class="gcard" onclick="openDetail('盖碗 · 乳白','€66')"><div class="ph"><img src="https://qingyunchai.netlify.app/assets/photos/product/fairness-cup-cream/fairness-cup-cream-1.jpg" onerror="this.style.display='none'"></div><div class="info"><h3>盖碗 · 乳白</h3><div class="price">€66</div></div></div>
    <div class="gcard" onclick="openDetail('香炉 · 琥珀','€66')"><div class="ph"><img src="https://qingyunchai.netlify.app/assets/photos/product/incense-amber/incense-amber-1.jpg" onerror="this.style.display='none'"></div><div class="info"><h3>香炉 · 琥珀</h3><div class="price">€66</div></div></div>
    <div class="gcard" onclick="openDetail('茶盘 · 长条','€38')"><div class="ph"><img src="https://qingyunchai.netlify.app/assets/photos/product/incense-tray-long/incense-tray-long-1.jpg" onerror="this.style.display='none'"></div><div class="info"><h3>茶盘 · 长条</h3><div class="price">€38</div></div></div>
  </div>
</div>

<!-- 详情 sheet -->
<div class="mask" id="mask" onclick="closeAll()"></div>
<div class="sheet" id="sheet">
  <div class="grab"></div>
  <div class="row">
    <img class="th" id="sheet-th" src="" alt="">
    <div>
      <h3 id="sheet-name"></h3>
      <div class="price" id="sheet-price"></div>
      <p>柴窑烧制，木灰落釉成色，每一件都不同。含手作证书与唯一编号。</p>
    </div>
  </div>
  <div class="btns">
    <button class="b-cart" onclick="toast('已加入购物袋')">加入购物袋</button>
    <button class="b-buy" onclick="openPay()">立即购买</button>
  </div>
</div>

<!-- 下单确认 -->
<div class="pay-sheet" id="pay-sheet">
  <div class="grab"></div>
  <h3 style="font-family:Georgia,serif;margin-bottom:10px" id="pay-name"></h3>
  <div class="line"><span>数量</span><b>1</b></div>
  <div class="line"><span>收货地址</span><b>Maria · Lisboa PT ›</b></div>
  <div class="line"><span>包邮含税 (DDP)</span><b>免费</b></div>
  <div class="total"><span>合计</span><b id="pay-total"></b></div>
  <button class="pay-cta" onclick="closeAll(); toast('✅ 跳转支付（原型演示）')">支付 €</button>
</div>

<script>
  var slides = document.querySelectorAll('.slide');
  var cur = 0;
  function goto(i){
    slides[cur].classList.remove('on');
    document.querySelectorAll('.dot')[cur].classList.remove('on');
    cur = (i+3)%3;
    slides[cur].classList.add('on');
    document.querySelectorAll('.dot')[cur].classList.add('on');
  }
  setInterval(function(){ goto(cur+1); }, 4000);
  var carouselEl = document.getElementById('scr-carousel');
  var touchX = null;
  carouselEl.addEventListener('touchstart', function(e){ touchX = e.touches[0].clientX; });
  carouselEl.addEventListener('touchend', function(e){
    if (touchX === null) return;
    var dx = e.changedTouches[0].clientX - touchX;
    if (Math.abs(dx) > 40) goto(cur + (dx < 0 ? 1 : -1));
    touchX = null;
  });
  function showGrid(){
    carouselEl.style.display = 'none';
    document.getElementById('scr-grid').classList.add('on');
  }
  function backCarousel(){
    document.getElementById('scr-grid').classList.remove('on');
    carouselEl.style.display = 'block';
  }
  var curItem = { name:'', price:0 };
  function openDetail(name, price){
    curItem.name = name; curItem.price = parseFloat(price.replace('€',''));
    document.getElementById('sheet-th').src = document.querySelector('.slide.on .img img').src;
    document.getElementById('sheet-name').textContent = name;
    document.getElementById('sheet-price').textContent = price;
    document.getElementById('mask').classList.add('on');
    document.getElementById('sheet').classList.add('on');
  }
  function openPay(){
    document.getElementById('sheet').classList.remove('on');
    document.getElementById('pay-name').textContent = curItem.name;
    document.getElementById('pay-total').textContent = '€' + curItem.price;
    document.getElementById('pay-sheet').classList.add('on');
  }
  function closeAll(){
    document.getElementById('mask').classList.remove('on');
    document.getElementById('sheet').classList.remove('on');
    document.getElementById('pay-sheet').classList.remove('on');
  }
  function toast(msg){
    var t = document.createElement('div');
    t.textContent = msg;
    t.style.cssText = 'position:absolute;left:50%;bottom:100px;transform:translateX(-50%);background:rgba(200,160,99,.95);color:#1b1713;padding:10px 18px;border-radius:20px;font-size:13px;z-index:99;font-weight:600';
    document.body.appendChild(t);
    setTimeout(function(){ t.style.opacity='0'; }, 1400);
    setTimeout(function(){ t.remove(); }, 1900);
  }
</script>
</body>
</html>
