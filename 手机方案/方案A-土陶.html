<!DOCTYPE html>
<html lang="zh">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>方案A · 土陶 · 两栏一屏</title>
<style>
  :root{
    --paper:#f4efe7; --card:#fbf8f2; --ink:#2b2620; --muted:#8d8577;
    --clay:#b98a5f; --line:#e3dacb; --dark:#262019;
  }
  *{margin:0;padding:0;box-sizing:border-box;-webkit-tap-highlight-color:transparent}
  body{font-family:-apple-system,"PingFang SC","Noto Sans SC",sans-serif;background:var(--paper);color:var(--ink);width:390px;height:844px;margin:0 auto;overflow:hidden;position:relative;box-shadow:0 0 60px rgba(0,0,0,.15)}
  .screen{display:none;position:absolute;inset:0;flex-direction:column}
  .screen.on{display:flex}
  /* 顶栏 */
  .top{display:flex;align-items:center;justify-content:space-between;padding:14px 18px 8px}
  .brand{font-family:Georgia,"Songti SC",serif;font-size:22px;letter-spacing:.06em}
  .top-ic{display:flex;gap:16px}
  .top-ic button{background:none;border:none;font-size:18px;cursor:pointer;position:relative}
  .badge{position:absolute;top:-6px;right:-8px;background:var(--clay);color:#fff;font-size:10px;border-radius:8px;padding:1px 5px}
  /* 首页网格：一屏 2×3 */
  .grid2{display:grid;grid-template-columns:1fr 1fr;gap:12px;padding:10px 16px 16px;flex:1;overflow:hidden}
  .card{background:var(--card);border:1px solid var(--line);border-radius:10px;overflow:hidden;display:flex;flex-direction:column;cursor:pointer;transition:.2s}
  .card:active{transform:scale(.97)}
  .card .ph{flex:1;background:#e7dfd2;overflow:hidden}
  .card .ph img{width:100%;height:100%;object-fit:cover;display:block}
  .card .info{padding:9px 12px 11px}
  .card h3{font-size:13px;font-weight:600;letter-spacing:.02em}
  .card .price{font-size:13px;color:var(--clay);margin-top:3px;font-weight:600}
  /* 底部 tab */
  .tabbar{display:flex;border-top:1px solid var(--line);background:rgba(251,248,242,.97)}
  .tabbar button{flex:1;background:none;border:none;padding:11px 0 14px;font-size:11px;color:var(--muted);cursor:pointer;display:flex;flex-direction:column;align-items:center;gap:3px}
  .tabbar button.on{color:var(--ink);font-weight:600}
  .tabbar .ic{font-size:19px;line-height:1}
  /* 详情页 */
  .det-head{display:flex;align-items:center;padding:12px 14px;gap:10px}
  .det-head button{background:none;border:none;font-size:20px;cursor:pointer}
  .det-head h2{font-size:14px;font-weight:600;flex:1;text-align:center;letter-spacing:.05em}
  .det-ph{height:44%;background:#e7dfd2}
  .det-ph img{width:100%;height:100%;object-fit:cover;display:block}
  .det-body{flex:1;display:flex;flex-direction:column;padding:16px 18px 0;overflow:hidden}
  .det-tag{font-size:11px;color:var(--clay);letter-spacing:.15em;margin-bottom:6px}
  .det-body h1{font-family:Georgia,"Songti SC",serif;font-size:24px;letter-spacing:.02em}
  .det-body .price{font-size:20px;color:var(--clay);font-weight:600;margin-top:8px}
  .det-body p{font-size:13px;color:var(--muted);line-height:1.8;margin-top:12px}
  .det-foot{display:flex;gap:12px;padding:12px 18px 20px;align-items:center}
  .fav{width:48px;height:48px;border-radius:24px;border:1px solid var(--line);background:#fff;font-size:20px;cursor:pointer}
  .buy{flex:1;height:48px;border-radius:24px;border:none;background:var(--dark);color:#f3ecdf;font-size:15px;letter-spacing:.1em;cursor:pointer}
  /* 下单抽屉 */
  .sheet{position:absolute;left:0;right:0;bottom:0;background:var(--card);border-radius:20px 20px 0 0;transform:translateY(110%);transition:.28s;z-index:30;padding:20px 18px 24px;box-shadow:0 -10px 40px rgba(0,0,0,.18)}
  .sheet.on{transform:translateY(0)}
  .grab{width:40px;height:4px;background:var(--line);border-radius:2px;margin:0 auto 16px}
  .sheet h3{font-size:16px;margin-bottom:12px}
  .qty{display:flex;align-items:center;gap:14px;margin-bottom:14px}
  .qty b{font-size:13px}
  .qty button{width:32px;height:32px;border-radius:16px;border:1px solid var(--line);background:#fff;font-size:16px;cursor:pointer}
  .addr{display:flex;align-items:center;gap:10px;background:#fff;border:1px solid var(--line);border-radius:10px;padding:12px;margin-bottom:14px;cursor:pointer}
  .addr .pin{font-size:18px}
  .addr .t{font-size:13px;line-height:1.5}
  .addr .t small{display:block;color:var(--muted);font-size:11px}
  .addr .arr{margin-left:auto;color:var(--muted)}
  .pay{width:100%;height:50px;border-radius:12px;border:none;background:var(--dark);color:#f3ecdf;font-size:15px;letter-spacing:.08em;cursor:pointer;display:flex;align-items:center;justify-content:center;gap:8px}
  .mask{position:absolute;inset:0;background:rgba(30,24,18,.45);opacity:0;pointer-events:none;transition:.25s;z-index:20}
  .mask.on{opacity:1;pointer-events:auto}
  /* 分类 chip */
  .chips{display:flex;gap:8px;padding:0 16px 10px;overflow-x:auto;flex-shrink:0}
  .chip{flex-shrink:0;padding:7px 14px;border-radius:16px;border:1px solid var(--line);background:#fff;font-size:12px;cursor:pointer;white-space:nowrap}
  .chip.on{background:var(--dark);color:#f3ecdf;border-color:var(--dark)}
</style>
</head>
<body>

<!-- 首页 -->
<div class="screen on" id="scr-home">
  <div class="top">
    <div class="brand">清原</div>
    <div class="top-ic">
      <button>🔍</button>
      <button onclick="showCart()">🛍️<span class="badge" id="cart-badge">2</span></button>
    </div>
  </div>
  <div class="chips">
    <button class="chip on">全部</button><button class="chip">灯具</button><button class="chip">茶器</button><button class="chip">马克杯</button><button class="chip">香炉</button>
  </div>
  <div class="grid2">
    <div class="card" onclick="openDetail('守光 · 罐形 · 深青灰','€260','柴烧台灯')">
      <div class="ph"><img src="https://qingyunchai.netlify.app/assets/photos/product/lamp-blue-gray/lamp-blue-gray-1.jpg" onerror="this.src='data:image/svg+xml,%3Csvg xmlns=%22http://www.w3.org/2000/svg%22 width=%22200%22 height=%22240%22%3E%3Crect fill=%22%23b98a5f%22 width=%22200%22 height=%22240%22/%3E%3C/svg%3E'"></div>
      <div class="info"><h3>守光 · 罐形 · 深青灰</h3><div class="price">€260</div></div>
    </div>
    <div class="card" onclick="openDetail('守光 · 球体 · 陨石坑','€260','柴烧台灯')">
      <div class="ph"><img src="https://qingyunchai.netlify.app/assets/photos/product/lamp-bicolor-sphere/lamp-bicolor-sphere-1.jpg" onerror="this.src='data:image/svg+xml,%3Csvg xmlns=%22http://www.w3.org/2000/svg%22 width=%22200%22 height=%22240%22%3E%3Crect fill=%22%238d8577%22 width=%22200%22 height=%22240%22/%3E%3C/svg%3E'"></div>
      <div class="info"><h3>守光 · 球体 · 陨石坑</h3><div class="price">€260</div></div>
    </div>
    <div class="card" onclick="openDetail('马克杯 · 熔岩','€38','柴烧马克杯')">
      <div class="ph"><img src="https://qingyunchai.netlify.app/assets/photos/product/mug-lava/mug-lava-1.jpg" onerror="this.src='data:image/svg+xml,%3Csvg xmlns=%22http://www.w3.org/2000/svg%22 width=%22200%22 height=%22240%22%3E%3Crect fill=%22%23a07a5a%22 width=%22200%22 height=%22240%22/%3E%3C/svg%3E'"></div>
      <div class="info"><h3>马克杯 · 熔岩</h3><div class="price">€38</div></div>
    </div>
    <div class="card" onclick="openDetail('盖碗 · 乳白','€66','柴烧茶器')">
      <div class="ph"><img src="https://qingyunchai.netlify.app/assets/photos/product/fairness-cup-cream/fairness-cup-cream-1.jpg" onerror="this.src='data:image/svg+xml,%3Csvg xmlns=%22http://www.w3.org/2000/svg%22 width=%22200%22 height=%22240%22%3E%3Crect fill=%22%23cbb99a%22 width=%22200%22 height=%22240%22/%3E%3C/svg%3E'"></div>
      <div class="info"><h3>盖碗 · 乳白</h3><div class="price">€66</div></div>
    </div>
    <div class="card" onclick="openDetail('香炉 · 琥珀','€66','柴烧香炉')">
      <div class="ph"><img src="https://qingyunchai.netlify.app/assets/photos/product/incense-amber/incense-amber-1.jpg" onerror="this.src='data:image/svg+xml,%3Csvg xmlns=%22http://www.w3.org/2000/svg%22 width=%22200%22 height=%22240%22%3E%3Crect fill=%22%23b08d5e%22 width=%22200%22 height=%22240%22/%3E%3C/svg%3E'"></div>
      <div class="info"><h3>香炉 · 琥珀</h3><div class="price">€66</div></div>
    </div>
    <div class="card" onclick="openDetail('茶盘 · 长条','€38','柴烧茶器')">
      <div class="ph"><img src="https://qingyunchai.netlify.app/assets/photos/product/incense-tray-long/incense-tray-long-1.jpg" onerror="this.src='data:image/svg+xml,%3Csvg xmlns=%22http://www.w3.org/2000/svg%22 width=%22200%22 height=%22240%22%3E%3Crect fill=%22%237d6f5c%22 width=%22200%22 height=%22240%22/%3E%3C/svg%3E'"></div>
      <div class="info"><h3>茶盘 · 长条</h3><div class="price">€38</div></div>
    </div>
  </div>
  <div class="tabbar">
    <button class="on"><span class="ic">🏺</span>作品</button>
    <button onclick="toast('工艺页')"><span class="ic">🔥</span>工艺</button>
    <button onclick="toast('关于页')"><span class="ic">🏮</span>关于</button>
    <button onclick="toast('我的页')"><span class="ic">👤</span>我的</button>
  </div>
</div>

<!-- 详情页 -->
<div class="screen" id="scr-detail">
  <div class="det-head">
    <button onclick="backHome()">←</button><h2 id="det-cat"></h2><button>⋯</button>
  </div>
  <div class="det-ph"><img id="det-img" src="" alt=""></div>
  <div class="det-body">
    <div class="det-tag">世间唯一 · 售出即无</div>
    <h1 id="det-name"></h1>
    <div class="price" id="det-price"></div>
    <p>柴窑 1280°C 烧制，木灰落釉成色，每一件都不同。含匠心手作证书与唯一编号。</p>
  </div>
  <div class="det-foot">
    <button class="fav" onclick="toast('已收藏 ❤')">♡</button>
    <button class="buy" onclick="openSheet()">立即购买</button>
  </div>
</div>

<!-- 下单抽屉 -->
<div class="mask" id="mask" onclick="closeSheet()"></div>
<div class="sheet" id="sheet">
  <div class="grab"></div>
  <h3 id="sheet-name"></h3>
  <div class="qty">
    <b>数量</b>
    <button onclick="qtyChange(-1)">−</button><b id="qty">1</b><button onclick="qtyChange(1)">+</button>
    <b style="margin-left:auto;color:var(--clay)" id="sheet-total"></b>
  </div>
  <div class="addr" onclick="toast('地址簿：已存 2 个地址')">
    <span class="pin">📍</span>
    <span class="t">Maria Silva<small>Rua Augusta 100, Lisboa, PT</small></span>
    <span class="arr">›</span>
  </div>
  <button class="pay" onclick="pay()">€ 立即支付</button>
</div>

<script>
  var cur = { name:'守光 · 罐形 · 深青灰', price:260, img:'' };
  var qty = 1;
  function openDetail(name, price, cat){
    cur.name = name; cur.price = parseFloat(price.replace('€',''));
    document.getElementById('det-name').textContent = name;
    document.getElementById('det-price').textContent = price;
    document.getElementById('det-cat').textContent = cat;
    document.getElementById('scr-home').classList.remove('on');
    document.getElementById('scr-detail').classList.add('on');
  }
  function backHome(){
    document.getElementById('scr-detail').classList.remove('on');
    document.getElementById('scr-home').classList.add('on');
  }
  function openSheet(){
    document.getElementById('sheet-name').textContent = cur.name;
    document.getElementById('mask').classList.add('on');
    document.getElementById('sheet').classList.add('on');
    updTotal();
  }
  function closeSheet(){
    document.getElementById('mask').classList.remove('on');
    document.getElementById('sheet').classList.remove('on');
  }
  function qtyChange(d){ qty = Math.max(1, qty+d); document.getElementById('qty').textContent = qty; updTotal(); }
  function updTotal(){ document.getElementById('sheet-total').textContent = '€' + (cur.price*qty); }
  function pay(){ closeSheet(); toast('✅ 跳转支付（原型演示）'); }
  function showCart(){ toast('购物袋 · 2 件'); }
  function toast(msg){
    var t = document.createElement('div');
    t.textContent = msg;
    t.style.cssText = 'position:absolute;left:50%;bottom:90px;transform:translateX(-50%);background:rgba(38,32,25,.92);color:#f3ecdf;padding:10px 18px;border-radius:20px;font-size:13px;z-index:99;transition:.3s';
    document.body.appendChild(t);
    setTimeout(function(){ t.style.opacity = '0'; }, 1400);
    setTimeout(function(){ t.remove(); }, 1900);
  }
</script>
</body>
</html>
