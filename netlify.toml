# Netlify 部署配置：静态站 + Serverless Functions（Stripe Checkout）
[build]
  publish = "site"
  functions = "netlify/functions"

# 环境变量在 Netlify 后台配置，绝不写进仓库：
#   STRIPE_SECRET_KEY  （sk_test_... / sk_live_...）
#   STRIPE_WEBHOOK_SECRET （支付回调验签，可选）

[functions]
  node_bundler = "esbuild"
  # @netlify/blobs 不能进 esbuild 打包（已知问题），需排除后在运行时加载
  external_node_modules = ["@netlify/blobs"]
